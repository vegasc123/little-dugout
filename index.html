<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Dugout — Baseball for kids</title>
<meta name="description" content="A baseball jersey, cap and ball for kids. Design your own: name, number and your logo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600&family=Bebas+Neue&family=Big+Shoulders+Display:wght@700;800;900&family=Graduate&family=Racing+Sans+One&family=Yellowtail&display=swap">
<style>
:root{--navy:#1b2a4a;--deep:#111c33;--gold:#d9a441;--gold-text:#7a560f;--white:#fff;--ink:#1b2233;--muted:#4b5163;--tile:#e7e8ed;--line:#e2e5ea;--ctl:#7b8794;--night-muted:#b3bccf;--display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.spin{transition:none!important}}
body{margin:0;background:var(--white);color:var(--ink);font:400 14px/22px Barlow,'Helvetica Neue',Arial,sans-serif}
a{color:var(--navy)}a:hover{color:var(--gold-text)}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.night :focus-visible{outline-color:var(--gold)}
.wrap{max-width:1360px;margin:0 auto;padding-inline:32px}
.caps{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.label{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{background:var(--navy);color:var(--white);padding:8px 24px;text-align:center;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
header{border-bottom:1px solid var(--line);background:var(--white)}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 32px;padding-block:8px}
.brand{display:flex;align-items:center;min-height:44px;text-decoration:none;color:var(--navy);font:800 24px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--gold-text);margin-left:6px}
nav.main{display:flex;flex-wrap:wrap;gap:0 32px}
nav.main a{text-decoration:none;padding:14px 0}
.linkbtn{min-height:44px;padding:0;border:0;background:none;color:var(--navy);cursor:pointer}
.linkbtn.u{text-decoration:underline;text-underline-offset:6px}
#bag{border-top:1px solid var(--line);padding-block:24px}
#bag .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;padding:10px 0;border-bottom:1px solid var(--line)}
#bag .row span:last-child,.muted{color:var(--muted)}
.hero{position:relative;background:var(--deep);color:var(--white);min-height:480px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--night-muted)}
.play{width:64px;height:64px;border-radius:50%;border:1px solid var(--white);display:flex;align-items:center;justify-content:center}
.play i{border-block:9px solid transparent;border-left:15px solid var(--white);margin-left:4px}
.hero .cap{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-block:32px}
.hero h1{margin:8px 0 0;font-weight:400;font-size:28px;line-height:36px;max-width:460px}
.hero .eyebrow{color:var(--gold)}
.hero a{color:var(--white);display:inline-flex;align-items:center;min-height:44px;text-underline-offset:6px}
section.block{padding-block:56px 64px}
h2{margin:0;font-weight:400;font-size:20px;line-height:28px;color:var(--navy)}
.grid{display:flex;flex-wrap:wrap;gap:40px 16px;margin-top:24px}
.card{flex:1 1 280px;max-width:460px;min-width:0;display:flex;flex-direction:column;gap:12px}
.tile{background:var(--tile)}
.tile img{display:block;width:100%;height:auto}
.card h3{margin:0;font-weight:500;font-size:14px;line-height:22px}
.card .top{display:flex;justify-content:space-between;gap:16px}
.card p{margin:0;font-size:13px;line-height:20px;color:var(--muted)}
.card a{display:inline-flex;align-items:center;min-height:44px;text-underline-offset:6px}
#personalizar{border-top:1px solid var(--line)}
.design{display:flex;flex-wrap:wrap;align-items:flex-start;gap:48px}
.panel{flex:1 1 360px;max-width:460px;min-width:0;display:flex;flex-direction:column;gap:24px}
.stagecol{flex:2 1 420px;max-width:620px;min-width:0;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.rowf{display:flex;flex-wrap:wrap;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:88px;min-height:44px;padding:0 16px;border:1px solid var(--ctl);background:none;color:var(--navy);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--white)}
input[type=text],input[type=email]{height:44px;padding:0 12px;border:1px solid var(--ctl);border-radius:0;background:var(--white);color:var(--ink);font-size:16px;width:100%}
input[type=range]{width:100%;height:44px;accent-color:var(--navy)}
input[type=file]{min-height:44px;font-size:14px}
.note{font-size:13px;line-height:20px;color:var(--muted);margin:0}
.msg{min-height:20px;font-size:13px;line-height:20px;color:var(--gold-text)}
.cta{min-height:48px;padding:0 24px;border:0;background:var(--navy);color:var(--white);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.stage{background:var(--tile);perspective:1400px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.spin{position:relative;transform-style:preserve-3d;transition:transform .12s linear}
.face{position:relative;container-type:inline-size;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{position:absolute;inset:0;transform:rotateY(180deg)}
.face>img.base{display:block;width:100%;height:auto;pointer-events:none}
.ov{position:absolute;text-align:center;pointer-events:none;line-height:1}
.num{font-family:var(--letter,Graduate),Georgia,serif;font-weight:400;color:var(--gold);paint-order:stroke fill}
.num.front{left:48%;top:30%;width:26%;font-size:calc(9cqw * var(--k,1));-webkit-text-stroke:.4cqw #fff}
.name.backn{left:0;right:0;top:23%;font:400 9cqw/1 var(--letter,Graduate),Georgia,serif;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);-webkit-text-stroke:.4cqw #fff;paint-order:stroke fill;white-space:nowrap}
.num.backn{left:0;right:0;top:33%;font-size:calc(28cqw * var(--k,1));letter-spacing:.02em;-webkit-text-stroke:1cqw #fff}
.engrave{left:32%;right:32%;top:45%;font-family:Yellowtail,'Brush Script MT',cursive;font-size:11cqw;line-height:1.1;color:var(--navy);white-space:nowrap}
.userlogo{position:absolute;height:auto;transform:translate(-50%,-50%);cursor:move;touch-action:none;outline:1px dashed var(--ctl);outline-offset:4px}
.turn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.turn input{flex:1 1 160px;min-width:0}
.ighead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 32px}
.ighead a{display:inline-flex;align-items:center;min-height:44px;text-underline-offset:6px}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:24px}
.reels .ph{aspect-ratio:9/16;background:var(--tile);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--muted)}
.reels .instagram-media{min-width:0!important;width:100%!important;margin:0!important}
[hidden]{display:none!important}
footer{background:var(--navy);color:var(--white)}
.foot{display:flex;flex-wrap:wrap;gap:40px 48px;justify-content:space-between;padding-block:48px 32px}
.foot .news{flex:1 1 280px;max-width:380px;display:flex;flex-direction:column;gap:8px}
.foot .news .label,.foot nav .label{color:var(--gold)}
.foot .news form{display:flex}
.foot .news input{background:transparent;color:var(--white);border-color:#8fa0c4;border-right:0}
.foot .news button{min-height:44px;padding:0 16px;border:1px solid var(--gold);background:var(--gold);color:var(--deep);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.foot .msg{color:var(--gold)}
.foot nav{flex:0 1 160px;display:flex;flex-direction:column}
.foot nav a{color:var(--white);text-decoration:none;padding:11px 0}
.legal{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-bottom:32px;font-size:12px;line-height:16px;color:var(--night-muted)}
.legal .brand{color:var(--white);font-size:20px;min-height:0}.legal .brand span{color:var(--gold)}
@media (max-width:600px){.wrap{padding-inline:20px}}
.lang{min-height:44px;padding:0 4px;border:0;background:none;color:var(--navy);cursor:pointer}
.tools{display:flex;align-items:center;gap:20px}
#bag .row{align-items:center}
#bag .row .info{flex:1 1 220px;min-width:0;display:flex;flex-direction:column}
#bag .row .info span:last-child{color:var(--muted)}
#bag .qty{display:flex;align-items:center;gap:4px}
#bag .qty button{width:44px;height:44px;border:1px solid var(--ctl);background:none;color:var(--navy);font-size:18px;cursor:pointer}
#bag .qty output{min-width:28px;text-align:center}
#bag .price{min-width:72px;text-align:right;color:var(--ink)!important}
#bag .total{display:flex;justify-content:space-between;gap:24px;padding:14px 0;font-weight:600}
.contact{display:flex;flex-wrap:wrap;gap:32px 48px;align-items:flex-start}
.contact .intro{flex:1 1 280px;max-width:420px}
.contact form{flex:2 1 360px;max-width:620px;display:flex;flex-direction:column;gap:16px}
textarea{min-height:120px;padding:10px 12px;border:1px solid var(--ctl);border-radius:0;background:var(--white);color:var(--ink);font:inherit;font-size:16px;width:100%;resize:vertical}
select{height:44px;padding:0 12px;border:1px solid var(--ctl);border-radius:0;background:var(--white);color:var(--ink);font:inherit;font-size:16px;width:100%}
</style>
</head>
<body>
<div class="bar" data-i18n="bar"></div>
<header>
  <div class="wrap head">
    <a class="brand" href="#top" aria-label="Little Dugout">Little <span>Dugout</span></a>
    <nav class="main caps" data-i18n-aria="navAria"><a href="#products" data-i18n="navProducts"></a><a href="#design" data-i18n="navDesign"></a><a href="#instagram">Instagram</a><a href="#contact" data-i18n="navContact"></a></nav>
    <div class="tools">
      <button class="lang caps" id="langBtn" type="button"></button>
      <button class="linkbtn caps" id="bagBtn" type="button" aria-expanded="false" aria-controls="bag"><span data-i18n="bag"></span> (<span id="bagCount">0</span>)</button>
    </div>
  </div>
  <div id="bag" class="wrap" hidden>
    <div class="caps" data-i18n="yourBag"></div>
    <p class="muted" id="bagEmpty" style="margin:8px 0 0" data-i18n="bagEmpty"></p>
    <div id="bagList"></div>
    <div class="total" id="bagTotal"><span data-i18n="subtotal"></span><span id="bagSum"></span></div>
    <p class="note" data-i18n="checkoutSoon"></p>
    <button class="linkbtn caps u" id="bagClear" type="button" data-i18n="bagClear"></button>
  </div>
</header>

<main>
<section class="hero night" id="top">
  <div class="ph"><div class="play" aria-hidden="true"><i></i></div><div class="label" style="color:inherit" data-i18n="videoPh"></div></div>
  <div class="wrap cap">
    <div><div class="label eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="headline"></h1></div>
    <a class="caps" href="#design" data-i18n="startDesign"></a>
  </div>
</section>

<section class="wrap block" id="products">
  <h2 data-i18n="threePieces"></h2>
  <div class="grid" id="grid"></div>
</section>

<section id="design" style="border-top:1px solid var(--line)">
  <div class="wrap block design">
    <div class="panel">
      <div><h2 data-i18n="design"></h2><p class="note" id="help" style="margin-top:4px"></p></div>
      <div class="field" role="group" data-i18n-aria="product"><div class="label" data-i18n="product"></div><div class="chips" id="tabs"></div></div>
      <div class="field" id="fLetter" role="group" data-i18n-aria="lettering"><div class="label" data-i18n="lettering"></div><div class="chips" id="letters"></div></div>
      <p class="note" id="ownHint" style="color:var(--ink)" data-i18n="ownHint" hidden></p>
      <div class="rowf" id="fJersey">
        <div class="field" style="flex:2 1 180px"><label class="label" for="nombre" data-i18n="nameLabel"></label><input id="nombre" type="text" maxlength="12" autocomplete="off" style="text-transform:uppercase"></div>
        <div class="field" style="flex:1 1 110px"><label class="label" for="numero" data-i18n="numberLabel"></label><input id="numero" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></div>
      </div>
      <div class="field" id="fTexto"><label class="label" for="texto" data-i18n="engraveLabel"></label><input id="texto" type="text" maxlength="16" autocomplete="off"></div>
      <div class="field" style="gap:8px">
        <label class="label" for="logo" data-i18n="logoLabel"></label>
        <input id="logo" type="file" accept="image/png" multiple>
        <p class="note" data-i18n="logoNote"></p>
        <div class="msg" id="logoMsg" aria-live="polite"></div>
        <div id="logoTools" hidden style="display:flex;flex-direction:column;gap:12px">
          <p class="note" style="color:var(--ink)" data-i18n="dragHint"></p>
          <div class="chips" id="pieces" role="group" data-i18n-aria="pieces"></div>
          <div class="chips" id="sides" role="group" data-i18n-aria="logoSide"></div>
          <label class="label" for="logoW" data-i18n="logoSize"></label>
          <input id="logoW" type="range" min="8" max="60" step="1" value="28">
          <div><button class="linkbtn caps u" id="logoRemove" type="button" data-i18n="logoRemove"></button></div>
        </div>
      </div>
      <div class="field" role="group" data-i18n-aria="size"><div class="label" data-i18n="size"></div><div class="chips" id="sizes"></div></div>
      <button class="cta" id="add" type="button"></button>
      <div class="msg" id="addMsg" aria-live="polite" style="min-height:22px"></div>
    </div>
    <div class="stagecol">
      <div class="stage" id="stage">
        <div class="spin" id="spin">
          <div class="face" id="front">
            <img class="base" id="frontImg" alt="" draggable="false">
            <div class="ov num front" id="numFront"></div>
            <div class="ov engrave" id="engrave"></div>
          </div>
          <div class="face back" id="back">
            <img class="base" id="backImg" alt="" draggable="false">
            <div class="ov name backn" id="nameBack"></div>
            <div class="ov num backn" id="numBack"></div>
          </div>
        </div>
      </div>
      <div class="turn" id="turn">
        <button class="linkbtn caps u" id="toFront" type="button" data-i18n="front"></button>
        <label class="label" for="angle" data-i18n="rotate"></label>
        <input id="angle" type="range" min="0" max="360" step="1" value="0">
        <button class="linkbtn caps u" id="toBack" type="button" data-i18n="back"></button>
      </div>
      <p class="note" data-i18n="previewNote"></p>
    </div>
  </div>
</section>

<section id="instagram" style="border-top:1px solid var(--line)">
  <div class="wrap block">
    <div class="ighead">
      <div><h2 data-i18n="igTitle"></h2><p class="note" style="margin-top:4px" data-i18n="igText"></p></div>
      <a class="caps" href="https://www.instagram.com/lucabaseball15/" target="_blank" rel="noopener" data-i18n="igFollow"></a>
    </div>
    <div class="reels" id="reels"></div>
  </div>
</section>

<section id="contact" style="border-top:1px solid var(--line)">
  <div class="wrap block contact">
    <div class="intro"><h2 data-i18n="contactTitle"></h2><p class="note" style="margin-top:4px" data-i18n="contactText"></p></div>
    <form id="contactForm">
      <div class="rowf">
        <div class="field" style="flex:1 1 200px"><label class="label" for="cName" data-i18n="cName"></label><input id="cName" type="text" autocomplete="name" required></div>
        <div class="field" style="flex:1 1 200px"><label class="label" for="cEmail" data-i18n="cEmail"></label><input id="cEmail" type="email" autocomplete="email" required></div>
      </div>
      <div class="field"><label class="label" for="cAbout" data-i18n="cAbout"></label><select id="cAbout"></select></div>
      <div class="field"><label class="label" for="cMsg" data-i18n="cMsg"></label><textarea id="cMsg" required></textarea></div>
      <div><button class="cta" type="submit" data-i18n="cSend"></button></div>
      <div class="msg" id="cOut" aria-live="polite" style="min-height:22px"></div>
    </form>
  </div>
</section>
</main>

<footer class="night">
  <div class="wrap foot">
    <div class="news">
      <label class="label" for="email" data-i18n="newsLabel"></label>
      <form id="news"><input id="email" type="email" placeholder="you@email.com" autocomplete="email" required><button type="submit" data-i18n="subscribe"></button></form>
      <div class="msg" id="newsMsg" aria-live="polite"></div>
    </div>
    <nav data-i18n-aria="shop"><div class="label" data-i18n="shop"></div><a href="#products" data-i18n="navProducts"></a><a href="#design" data-i18n="navDesign"></a><a href="#contact" data-i18n="navContact"></a></nav>
    <nav data-i18n-aria="helpNav"><div class="label" data-i18n="helpNav"></div><a href="#top" data-i18n="sizeGuide"></a><a href="#top" data-i18n="shipping"></a><a href="#top" data-i18n="returns"></a></nav>
    <nav data-i18n-aria="more"><div class="label" data-i18n="more"></div><a href="#top" data-i18n="terms"></a><a href="#top" data-i18n="privacy"></a><a href="https://www.instagram.com/lucabaseball15/">Instagram</a></nav>
  </div>
  <div class="wrap legal"><div class="brand">Little <span>Dugout</span></div><div data-i18n="legal"></div></div>
</footer>

  // Controls for the selected file: which one, which side, how big.
